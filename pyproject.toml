[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whyev-backend"
version = "1.0.0"
description = "WhyEV Backend API — EV consultation, subsidy eligibility, and dealer matching platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    # Database (Supabase / Postgres)
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pgvector==0.2.5",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "httpx==0.27.0",          # Google OAuth verification
    # AI — Groq (open-source LLMs: Llama 3, Mixtral)
    "groq==0.9.0",
    # Embeddings (local, free — no API key needed)
    "sentence-transformers==3.0.1",
    # Pydantic / settings
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    # Observability
    "structlog==24.1.0",
    "sentry-sdk[fastapi]==2.3.1",
    "prometheus-fastapi-instrumentator==7.0.0",
    # Misc
    "python-dateutil==2.9.0.post0",
    "aiofiles==23.2.1",
    "qrcode[pil]==7.4.2",
    "Pillow==10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "faker==25.2.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
