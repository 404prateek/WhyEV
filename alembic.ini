# A generic, single database configuration.

[alembic]
script_location = app/migrations
prepend_sys_path = .
version_path_separator = os  # Use os.pathsep

# Use DATABASE_URL from environment (set via pydantic-settings)
sqlalchemy.url = postgresql+asyncpg://whyev:whyev@localhost:5432/whyev

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
